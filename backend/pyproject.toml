[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-knowledge-assistant-backend"
version = "0.1.0"
description = "FastAPI orchestration backend for the Jira, Confluence and Figma knowledge assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx2>=2.5,<3.0",
  "jsonschema>=4.23,<5.0",
  "mcp==2.0.0",
  "pgvector>=0.3,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
# Le modele d'embeddings et son moteur, isoles dans un extra. Ils pesent environ
# 2,3 Go a eux seuls : les inclure au socle alourdirait aussi le worker, la
# migration et tout environnement qui n'indexe rien.
#
# Installer torch depuis l'index CPU AVANT cet extra, sinon pip tire la variante
# CUDA -- plus de 2 Go de bibliotheques pour un GPU que ni cette machine ni le
# conteneur ne possedent :
#   pip install --index-url https://download.pytorch.org/whl/cpu torch
embeddings = [
  "sentence-transformers>=3.3,<6.0",
]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: requires an explicitly configured PostgreSQL integration database",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
