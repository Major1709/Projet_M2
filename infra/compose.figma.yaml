# Surcouche d'activation Figma, developpement uniquement.
#
# Figma est lu par son API REST, pas par son serveur MCP.
#
# Pourquoi : le serveur MCP de Figma n'accepte que les clients inscrits a son
# catalogue. Son point d'enregistrement dynamique repond 403 Forbidden a tout le
# reste, et sa console d'applications ne delivre pas la portee mcp:connect --
# aucun flux OAuth ne peut donc aboutir pour ce backend. Le blocage est
# administratif, pas technique. Verifie le 2026-08-14.
#
# L'API REST n'a pas cette barriere, et elle satisfait les invariants de
# transport sans exception : api.figma.com est un hote public en HTTPS sur 443,
# donc le controle anti-SSRF s'applique inchange. Un serveur MCP interne dans
# Docker, lui, aurait exige de relacher ce controle.
#
# Lecture seule par construction, pas seulement par politique : l'API REST de
# Figma n'expose aucun point d'entree qui cree ou modifie un noeud. Creer une
# frame demande l'API Plugin, qui s'execute dans l'editeur Figma.
#
# Autonome : elle n'a pas besoin des surcouches Atlassian et peut s'appliquer
# seule ou avec elles.
#
# Usage :
#   docker compose -f compose.yaml -f compose.figma.yaml up -d
#
# Prerequis :
#   1. creer un jeton personnel dans Figma :
#        Settings > Security > Personal access tokens
#      portee « File content : read-only » uniquement.
#      Deposer sa valeur dans ${SECRETS_DIR}/figma_personal_access_token avec un
#      editeur de texte -- pas avec echo, qui laisserait le jeton dans
#      l'historique du shell. Le fichier ne contient que le jeton, sans
#      guillemets ni retour a la ligne superflu.
#   2. renseigner dans infra/.env :
#        PKA_MCP_FIGMA_GRANT_TENANT_ID et PKA_MCP_FIGMA_GRANT_USER_ID
#      Ces valeurs doivent correspondre EXACTEMENT aux en-tetes d'identite
#      envoyes sur POST /api/mcp/reads, sinon toute lecture repond 503 sans
#      indiquer la cause (comparaison a temps constant, volontairement muette).
#
# Un secret Docker en lecture seule suffit ici, contrairement aux credentials
# Atlassian : un jeton personnel ne tourne pas, il n'y a donc rien a reecrire.
# Le passage a OAuth par utilisateur remplacera ce fichier par un document
# renouvelable monte en lecture-ecriture, et basculera
# PKA_MCP_FIGMA_CREDENTIAL_KIND sur « oauth » -- Figma authentifie un jeton
# personnel par l'en-tete X-Figma-Token et un jeton OAuth par Authorization,
# et l'adaptateur n'en envoie qu'un seul, choisi par cette variable.
#
# Le fileKey n'est pas configurable : il est epingle dans le registre et injecte
# cote serveur, comme les cloudId Atlassian. Un fichier choisi par le client
# ouvrirait la lecture a tout ce que le jeton peut atteindre. Le nodeId, lui,
# est un argument public : il ne designe qu'un noeud a l'interieur du fichier
# epingle, donc aucune valeur ne permet d'en sortir.
#
# Le worker ne recoit deliberement ni jeton ni liaison : les lectures MCP sont
# servies par l'API. Moindre privilege.

services:
  api:
    environment:
      PKA_MCP_READS_ENABLED: "true"
      PKA_MCP_FIGMA_ENABLED: "true"
      PKA_MCP_GRANT_BACKEND: development_files
      PKA_MCP_FIGMA_BEARER_TOKEN_FILE: /run/secrets/figma_personal_access_token
      PKA_MCP_FIGMA_CREDENTIAL_KIND: personal_access_token
      PKA_MCP_FIGMA_GRANT_TENANT_ID: ${PKA_MCP_FIGMA_GRANT_TENANT_ID:?definir PKA_MCP_FIGMA_GRANT_TENANT_ID dans infra/.env}
      PKA_MCP_FIGMA_GRANT_USER_ID: ${PKA_MCP_FIGMA_GRANT_USER_ID:?definir PKA_MCP_FIGMA_GRANT_USER_ID dans infra/.env}
    secrets:
      - figma_personal_access_token

secrets:
  figma_personal_access_token:
    file: ${SECRETS_DIR:-./secrets/dev}/figma_personal_access_token
